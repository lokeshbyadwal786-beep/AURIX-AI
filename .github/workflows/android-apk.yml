
name: Build AURIX AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q AURIX-AI-GitHub-APK-Build-Bundle.zip -d build-bundle
          cp -R build-bundle/android ./android

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: '-p android :app:assembleDebug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
